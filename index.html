<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Tyr - Campanha RPG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Crimson Text', serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #map-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: grab;
        }

        #map-container:active {
            cursor: grabbing;
        }

        #map-wrapper {
            position: absolute;
            transform-origin: 0 0;
            width: 100%;
            height: 100%;
        }

        #map-svg {
            width: 100%;
            height: 100%;
        }

        /* Estilos das cidades no SVG */
        .city-group {
            cursor: pointer;
            transition: filter 0.3s ease, transform 0.3s ease;
            transform-origin: center;
        }

        .city-group:hover {
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.7)) brightness(1.2);
        }

        .city-group.active {
            filter: drop-shadow(0 0 12px rgba(255, 180, 0, 0.9)) brightness(1.3);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 12px rgba(255, 180, 0, 0.9)) brightness(1.3); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1)) brightness(1.5); }
        }

        /* Painel de informações */
        #info-panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100vh;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f0a 100%);
            border-left: 3px solid #8b6914;
            box-shadow: -5px 0 30px rgba(0,0,0,0.7);
            z-index: 1000;
            transition: right 0.4s ease;
            overflow-y: auto;
            padding: 30px;
        }

        #info-panel.open {
            right: 0;
        }

        #info-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        #close-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 36px;
            height: 36px;
            background: rgba(139, 105, 20, 0.3);
            border: 1px solid #8b6914;
            border-radius: 50%;
            color: #d4a843;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #close-panel:hover {
            background: rgba(139, 105, 20, 0.6);
        }

        #city-name {
            font-family: 'MedievalSharp', cursive;
            font-size: 28px;
            color: #d4a843;
            margin-bottom: 5px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(139, 105, 20, 0.4);
        }

        #city-region {
            font-family: 'Crimson Text', serif;
            font-size: 14px;
            color: #a08050;
            font-style: italic;
            margin-bottom: 20px;
        }

        .info-section {
            margin-bottom: 20px;
        }

        .info-section h3 {
            font-family: 'MedievalSharp', cursive;
            font-size: 16px;
            color: #c9a84c;
            margin-bottom: 8px;
        }

        .info-section p {
            font-size: 16px;
            color: #ccc;
            line-height: 1.6;
        }

        .info-section ul {
            list-style: none;
            padding: 0;
        }

        .info-section ul li {
            color: #ccc;
            font-size: 15px;
            padding: 4px 0;
            padding-left: 18px;
            position: relative;
        }

        .info-section ul li::before {
            content: '\2726';
            position: absolute;
            left: 0;
            color: #8b6914;
        }

        /* Controles de zoom */
        #zoom-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 500;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(44, 24, 16, 0.9);
            border: 2px solid #8b6914;
            border-radius: 8px;
            color: #d4a843;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .zoom-btn:hover {
            background: rgba(139, 105, 20, 0.5);
        }

        /* Botão de trilha */
        #trail-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            padding: 10px 20px;
            font-family: 'MedievalSharp', cursive;
            font-size: 14px;
            background: rgba(44, 24, 16, 0.9);
            border: 2px solid #8b6914;
            border-radius: 8px;
            color: #d4a843;
            cursor: pointer;
            z-index: 500;
            transition: background 0.2s, border-color 0.2s;
        }

        #trail-btn:hover {
            background: rgba(139, 105, 20, 0.5);
        }

        #trail-btn.active {
            background: rgba(139, 105, 20, 0.4);
            border-color: #d4a843;
        }

        /* Controles da trilha */
        #trail-controls {
            position: fixed;
            top: 55px;
            left: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            z-index: 501;
            max-width: 220px;
        }

        #trail-season {
            width: 100%;
            padding: 6px 8px;
            font-family: 'Crimson Text', serif;
            font-size: 12px;
            background: rgba(44, 24, 16, 0.95);
            border: 1px solid #8b6914;
            border-radius: 6px;
            color: #d4a843;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        #trail-season option {
            background: #2c1810;
            color: #d4a843;
        }

        #trail-season option:disabled {
            color: #666;
        }

        .trail-ctrl-btn {
            padding: 6px 12px;
            font-family: 'Crimson Text', serif;
            font-size: 13px;
            background: rgba(44, 24, 16, 0.9);
            border: 1px solid #8b6914;
            border-radius: 6px;
            color: #d4a843;
            cursor: pointer;
            transition: background 0.2s;
        }

        .trail-ctrl-btn:hover {
            background: rgba(139, 105, 20, 0.5);
        }

        .trail-ctrl-btn.active {
            background: rgba(139, 105, 20, 0.4);
            border-color: #d4a843;
        }

        /* Instrução */
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Crimson Text', serif;
            font-size: 14px;
            color: #999;
            background: rgba(26, 15, 10, 0.85);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(139, 105, 20, 0.3);
            z-index: 500;
            pointer-events: none;
            opacity: 1;
            transition: opacity 2s ease;
        }

        /* Scrollbar */
        #info-panel::-webkit-scrollbar {
            width: 8px;
        }

        #info-panel::-webkit-scrollbar-track {
            background: #1a0f0a;
        }

        #info-panel::-webkit-scrollbar-thumb {
            background: #8b6914;
            border-radius: 4px;
        }

        /* Menu Wiki lateral */
        #wiki-menu {
            position: fixed;
            top: 130px;
            left: 15px;
            width: 200px;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            z-index: 500;
            font-family: 'Crimson Text', serif;
        }

        #wiki-menu::-webkit-scrollbar {
            width: 5px;
        }

        #wiki-menu::-webkit-scrollbar-thumb {
            background: #8b6914;
            border-radius: 3px;
        }

        .wiki-section {
            background: rgba(44, 24, 16, 0.9);
            border: 2px solid #8b6914;
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .wiki-section-header {
            padding: 10px 14px;
            font-family: 'MedievalSharp', cursive;
            font-size: 14px;
            color: #d4a843;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .wiki-section-header:hover {
            background: rgba(139, 105, 20, 0.3);
        }

        .wiki-section-header .arrow {
            transition: transform 0.3s;
            font-size: 12px;
        }

        .wiki-section-header.open .arrow {
            transform: rotate(90deg);
        }

        .wiki-section-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .wiki-section-list.open {
            max-height: 500px;
        }

        .wiki-item {
            padding: 7px 14px 7px 20px;
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            border-top: 1px solid rgba(139, 105, 20, 0.15);
        }

        .wiki-item:hover {
            background: rgba(139, 105, 20, 0.2);
            color: #d4a843;
        }

        .wiki-item.active {
            background: rgba(139, 105, 20, 0.35);
            color: #d4a843;
        }

        /* Imagem no painel de info */
        .info-portrait {
            width: 100%;
            max-width: 200px;
            border-radius: 8px;
            border: 2px solid #8b6914;
            margin-bottom: 15px;
            display: block;
        }

        /* Links de locais no texto */
        .map-link {
            color: #d4a843;
            text-decoration: underline;
            text-decoration-style: dotted;
            cursor: pointer;
            transition: color 0.2s;
        }

        .map-link:hover {
            color: #f0d060;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map-wrapper">
            <object id="map-svg" type="image/svg+xml" data="Mapa-Tyr.svg">Mapa de Tyr</object>
        </div>
    </div>

    <div id="zoom-controls">
        <button class="zoom-btn" id="zoom-in" aria-label="Aumentar zoom">+</button>
        <button class="zoom-btn" id="zoom-out" aria-label="Diminuir zoom">-</button>
        <button class="zoom-btn" id="zoom-reset" aria-label="Resetar zoom" style="font-size:14px;">&#x27F2;</button>
    </div>

    <button id="trail-btn" aria-label="Mostrar trilha">Mostrar Jornada</button>
    <div id="trail-controls" style="display:none;">
        <select id="trail-season" class="trail-ctrl-btn">
            <option value="solnegro1">O Sol Negro - Temporada 1</option>
            <option value="solnegro2" disabled>O Sol Negro - Temporada 2</option>
            <option value="cicatriz1" disabled>Cicatriz do Eclipse - Temporada 1</option>
        </select>
        <button id="trail-auto" class="trail-ctrl-btn">Auto</button>
        <button id="trail-step" class="trail-ctrl-btn">Passo a Passo</button>
        <button id="trail-next" class="trail-ctrl-btn" style="display:none;">&#9654;</button>
    </div>

    <div id="wiki-menu">
        <div class="wiki-section">
            <div class="wiki-section-header" onclick="toggleWikiSection(this)">
                <span>Personagens</span>
                <span class="arrow">&#9654;</span>
            </div>
            <div class="wiki-section-list" id="characters-list"></div>
        </div>
        <div class="wiki-section">
            <div class="wiki-section-header" onclick="toggleWikiSection(this)">
                <span>Legião</span>
                <span class="arrow">&#9654;</span>
            </div>
            <div class="wiki-section-list" id="legion-list"></div>
        </div>
        <div class="wiki-section">
            <div class="wiki-section-header" onclick="toggleWikiSection(this)">
                <span>Vilões</span>
                <span class="arrow">&#9654;</span>
            </div>
            <div class="wiki-section-list" id="villains-list"></div>
        </div>
    </div>

    <div id="info-panel">
        <button id="close-panel" aria-label="Fechar painel">&times;</button>
        <h2 id="city-name">Selecione uma cidade</h2>
        <p id="city-region"></p>
        <div id="city-info"></div>
    </div>

    <div id="instructions">Clique nas cidades para ver informações. Arraste para mover o mapa. Use scroll para zoom.</div>

    <script>
        // ===== DADOS DAS CIDADES =====
        // Os IDs correspondem aos grupos no SVG
        const cities = {
            "Sedraxis": {
                region: "Norte - Próximo às Iron Wastes",
                description: "Cidade do antigo Rei Feiticeiro Wyan, que enlouqueceu após aniquilar os Homens da Peste. Wyan sofria com pesadelos de uma consciência pesada e morreu pouco tempo depois. A cidade carrega as marcas sombrias de seu reinado.",
                population: "Desconhecida",
                government: "Rei Feiticeiro Wyan (morto)",
                features: [
                    "Domínio do antigo Rei Feiticeiro Wyan",

                    "Estátua do Guardião (espada e fogo)"
                ],

            "Ered-Luin": {
                displayName: "Erëd Luin",
                region: "Centro-Norte - Montanhas",

                government: "Não há governo atual (cidade destruída)",

                    "Estátua do Guardião (espada e fogo)"
                ],
                notes: "Dregoth, o Rei Morto, está tentando roubar o Coração da Montanha. A cidade possui um portal para o Plano Elemental do Fogo."
            },
            "Arenvaalis": {
                region: "Nordeste - Costa",
                description: "Uma das 3 grandes cidades de Tyr, governada pela temível Abalach-Re, a Senhora das Tempestades. Tiranos draconatos mantêm o poder herdado dos dragões que um dia governaram estas terras.",
                population: "Grande cidade",
                government: "Rei Feiticeira Abalach-Re",
                features: [
                    "Governada por tiranos draconatos",
                    "Escravidão legalizada",
                    "Hellvault de Arenvaalis",
                    "Estátua do Guardião (espada e fogo)"
                ],
                notes: "Abalach-Re é a Senhora das Tempestades, dizimou os Caçadores de Água e Sal. Jurou Hamanu de morte. Pretende devorar o mundo todo. Inscrito no pilar do Hellvault: 'Nas areias do tempo, sua consciência se esvaiu'."
            },
            "Thalas_x27_Dar": {
                displayName: "Thalas'dar",
                region: "Oeste - Costa",
                description: "Vilarejo costeiro de onde Stor saiu em busca de seu passado quando completou 15 anos. Localizada na costa oeste de Tyr, próxima à floresta de Elencor.",
                population: "Vilarejo",
                government: "Desconhecido",
                features: [
                    "Vilarejo de origem de Stor",
                    "Próxima à Floresta de Elencor",
                    "Costa oeste de Tyr"
                ],
                notes: "Fannar criou Stor nas proximidades. Quando Stor completou 15 anos, saiu em busca deste vilarejo."
            },
            "Ur-Draxa": {
                region: "Centro-Leste",
                description: "Uma das 3 grandes cidades de Tyr, governada por Dregoth, o Rei Morto e Primeiro Campeão de Borys. Tiranos draconatos mantêm o poder herdado dos dragões ancestrais.",
                population: "Grande cidade",
                government: "Rei Feiticeiro Dregoth, o Rei Morto",
                features: [
                    "Domínio do Primeiro Campeão de Borys",
                    "Governada por tiranos draconatos",
                    "Escravidão legalizada",
                    "Estátua do Guardião (espada e fogo)"
                ],
                notes: "Dregoth foi o Primeiro Campeão, responsável por eliminar os Homens Lagartos. Agora tenta roubar o Coração da Montanha de Erëd Luin."
            },
            "Veyrinn": {
                region: "Sudeste - Costa",
                description: "Uma bela cidade em camadas, lar de Oronis e da poderosa família Maralen. Seu palácio principal está fortemente ligado à natureza. Governada pelo Sexto Campeão, que abandonou a corrupção.",
                population: "Grande cidade",
                government: "Rei Feiticeiro Oronis (Sexto Campeão / Líder da Legião)",
                features: [
                    "Primeiro nível: as Docas",
                    "Segundo nível: os Mercadores",
                    "Terceiro nível: Negociadores e Burocratas (sede da Família Maralen)",
                    "Palácio de Oronis (ligado à Natureza)",
                    "Catedral de Veyrinn (estilo Notre Dame, múltiplos deuses)",
                    "Hellvault de Veyrinn (corpo de dragão com Corrupção selada)",
                    "Ponte Oeste",
                    "Estátua do Guardião (espada e fogo)"
                ],
                notes: "Oronis é o Sexto Campeão de Borys, mas abandonou a Ascensão Dracônica cedo e levou séculos para se curar da Corrupção. Ele é um dos líderes da Legião da Estrela da Manhã. A cidade é protegida pela Preservação. No Hellvault está inscrito: 'Seu corpo, submerso em sua própria Hubris'."
            },
            "Myreendale": {
                displayName: "Myrrendale",
                region: "Sul - Farmlands",
                description: "Uma cidade próspera com um grande porto em construção para fomentar o comércio. Foi palco do Cerco de Myrrendale, onde a Legião da Estrela da Manhã defendeu a cidade contra a Ascensão Dracônica de Ozul.",
                population: "Cidade próspera",
                government: "Desconhecido",
                features: [
                    "Grande porto em construção",
                    "Estábulo do Seu Zé",
                    "Estátua do Guardião (espada e fogo)",
                    "Presença da Companhia Maralen",
                    "Teatro com representações do Guardião"
                ],
                notes: "O Cerco de Myrrendale foi uma batalha épica onde a Legião impediu a Ascensão Dracônica. Abalach-Re (dragão púrpura) lutou nos mares, ferindo gravemente Fannar. Xolo morreu afogado. A cidade serviu de rota para Elencor e Veyrinn."
            },
            "Hamerhold": {
                displayName: "Hammerhold",
                region: "Sul - Interior",
                description: "Uma das 3 grandes cidades de Tyr, governada por Salaak'nir, o Cobiçoso. Uma cidade pobre e opressora, com olhos em todos os lugares. Governada por tiranos draconatos que herdaram o poder dos dragões.",
                population: "Grande cidade",
                government: "Rei Feiticeiro Salaak'nir, o Cobiçoso",
                features: [
                    "Rede de espionagem de Salaak'nir",
                    "Estalagem do Martelo",
                    "Escravidão legalizada",
                    "Governada por tiranos draconatos",
                    "Ozul é um nobre local",
                    "Estátua do Guardião (espada e fogo)"
                ],
                notes: "Salaak'nir é o espião máximo, com olhos em todos os continentes. Seu braço direito é Lyari, uma mulher de vermelho. Aprisionou Sorte e Lysara após o Cerco de Myrrendale. Ozul, um draconato nobre daqui, realizou experimentos em criaturas vivas para a Ascensão Dracônica."
            },
            "Orvengrad": {
                region: "Sudoeste - Costa",
                description: "Cidade nas costas sudoeste de Tyr. Pouco se sabe sobre seus governantes atuais, mas a presença da Companhia Maralen sugere atividade comercial significativa.",
                population: "Desconhecida",
                government: "Desconhecido",
                features: [
                    "Presença da Companhia Maralen",
                    "Costa sudoeste de Tyr",
                    "Estátua do Guardião (espada e fogo)"
                ],
                notes: "A Companhia Maralen está presente em todas as cidades de Tyr, fornecendo logística e comércio eficientes."
            },
            "Ilha_Arenvaalis": {
                displayName: "Ilha de Arenvaalis",
                region: "Nordeste - Arquipélago",
                description: "A ilha isolada ao nordeste do continente de Tyr, onde se ergue a cidade de Arenvaalis. Suas águas traiçoeiras e ventos tempestuosos — domínio de Abalach-Re — tornam a navegação perigosa para quem não conhece as rotas.",
                population: "Além da cidade, poucos assentamentos costeiros",
                government: "Sob domínio de Abalach-Re",
                features: [
                    "Águas traiçoeiras controladas pela Senhora das Tempestades",
                    "Rotas marítimas perigosas",
                    "Isolamento natural como defesa",
                    "Costa rochosa e falésias"
                ],
                notes: "A posição geográfica isolada da ilha torna Arenvaalis difícil de invadir. Abalach-Re usa as tempestades para controlar quem se aproxima."
            },
            "Elencor_Forest": {
                displayName: "Floresta de Elencor",
                region: "Centro-Oeste",
                description: "Uma vasta floresta antiga que domina o centro-oeste de Tyr. Densa e misteriosa, Elencor é lar de criaturas ancestrais e serve como rota entre diversas cidades do continente.",
                population: "Criaturas selvagens e possivelmente druidas",
                government: "Sem governo — território selvagem",
                features: [
                    "Floresta ancestral e densa",
                    "Rota entre Myrrendale, Thalas'dar e outras cidades",
                    "Criaturas perigosas habitam seu interior",
                    "Fonte de recursos naturais",
                    "Possível conexão com a Preservação de Oronis"
                ],
                notes: "A Legião utilizou Elencor como rota após o Cerco de Myrrendale. A floresta é vasta o suficiente para esconder exércitos inteiros. Poucos se aventuram em seu coração."
            }
        };

        // IDs dos grupos de cidades no SVG
        const cityIds = [
            "Sedraxis",
            "Ered-Luin",
            "Arenvaalis",
            "Ilha_Arenvaalis",
            "Thalas_x27_Dar",
            "Ur-Draxa",
            "Veyrinn",
            "Myreendale",
            "Elencor_Forest",
            "Hamerhold",
            "Orvengrad"
        ];

        // ===== VARIÁVEIS GLOBAIS =====
        const mapContainer = document.getElementById('map-container');
        const mapWrapper = document.getElementById('map-wrapper');
        const mapSvg = document.getElementById('map-svg');
        const infoPanel = document.getElementById('info-panel');
        const instructions = document.getElementById('instructions');

        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX, startY;
        let lastTranslateX, lastTranslateY;
        let svgDoc = null;

        // ===== INICIALIZAR SVG =====
        mapSvg.addEventListener('load', () => {
            svgDoc = mapSvg.contentDocument;
            if (!svgDoc) return;

            // Configurar cada cidade como clicável
            cityIds.forEach(id => {
                const group = svgDoc.getElementById(id);
                if (group) {
                    group.style.cursor = 'pointer';
                    group.style.transition = 'filter 0.3s ease';

                    group.addEventListener('mouseenter', () => {
                        if (!group.classList.contains('active')) {
                            group.style.filter = 'brightness(1.15)';
                        }
                    });

                    group.addEventListener('mouseleave', () => {
                        if (!group.classList.contains('active')) {
                            group.style.filter = '';
                        }
                    });

                    group.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectCity(id);
                    });
                }
            });

            // Clique no fundo para desselecionar
            svgDoc.addEventListener('click', (e) => {
                let isCity = false;
                cityIds.forEach(id => {
                    const group = svgDoc.getElementById(id);
                    if (group && group.contains(e.target)) {
                        isCity = true;
                    }
                });
                if (!isCity) {
                    deselectAll();
                }
            });

            // Injetar estilos no SVG
            const style = svgDoc.createElementNS('http://www.w3.org/2000/svg', 'style');
            style.textContent = `
                .city-dimmed {
                    opacity: 0.3;
                    transition: opacity 0.4s ease;
                }
                .city-highlighted {
                    opacity: 1;
                    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
                    transition: opacity 0.4s ease, filter 0.4s ease;
                }
                .city-normal {
                    transition: opacity 0.4s ease;
                }
            `;
            svgDoc.querySelector('svg').appendChild(style);

            // Criar overlay escuro
            const svgEl = svgDoc.querySelector('svg');
            const overlay = svgDoc.createElementNS('http://www.w3.org/2000/svg', 'rect');
            overlay.setAttribute('id', 'dim-overlay');
            overlay.setAttribute('width', '100%');
            overlay.setAttribute('height', '100%');
            overlay.setAttribute('fill', 'rgba(0, 0, 0, 0.55)');
            overlay.setAttribute('pointer-events', 'none');
            overlay.style.opacity = '0';
            overlay.style.transition = 'opacity 0.4s ease';
            svgEl.appendChild(overlay);

            // Propagar scroll/wheel do SVG para o zoom do mapa
            svgDoc.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = mapContainer.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const prevScale = scale;
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                scale = Math.min(Math.max(scale * delta, 0.5), 4);

                translateX = mouseX - (mouseX - translateX) * (scale / prevScale);
                translateY = mouseY - (mouseY - translateY) * (scale / prevScale);

                updateTransform();
            }, { passive: false });

            fitMapToScreen();
        });

        function selectCity(id) {
            const svgEl = svgDoc.querySelector('svg');

            // Mostrar overlay escuro

            cityIds.forEach(cid => {
                const g = svgDoc.getElementById(cid);
                if (g) {
                    g.classList.remove('active', 'city-highlighted');
                    g.style.filter = '';

                    svgEl.insertBefore(g, overlay);

            const group = svgDoc.getElementById(id);

        // ===== PAN (ARRASTAR MAPA) =====
        mapContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            lastTranslateX = translateX;
            lastTranslateY = translateY;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = lastTranslateX + (e.clientX - startX);
            translateY = lastTranslateY + (e.clientY - startY);
            updateTransform();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // ===== ZOOM =====
        mapContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = mapContainer.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const prevScale = scale;
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale = Math.min(Math.max(scale * delta, 0.5), 4);

            translateX = mouseX - (mouseX - translateX) * (scale / prevScale);
            translateY = mouseY - (mouseY - translateY) * (scale / prevScale);

            updateTransform();
        });

        document.getElementById('zoom-in').addEventListener('click', () => {
            const prevScale = scale;
            scale = Math.min(scale * 1.2, 4);
            const centerX = mapContainer.clientWidth / 2;
            const centerY = mapContainer.clientHeight / 2;
            translateX = centerX - (centerX - translateX) * (scale / prevScale);
            translateY = centerY - (centerY - translateY) * (scale / prevScale);
            updateTransform();
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            const prevScale = scale;
            scale = Math.max(scale * 0.8, 0.5);
            const centerX = mapContainer.clientWidth / 2;
            const centerY = mapContainer.clientHeight / 2;
            translateX = centerX - (centerX - translateX) * (scale / prevScale);
            translateY = centerY - (centerY - translateY) * (scale / prevScale);
            updateTransform();
        });

        document.getElementById('zoom-reset').addEventListener('click', () => {
            fitMapToScreen();
        });

        function updateTransform() {
            mapWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function fitMapToScreen() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        }

        // ===== TOUCH SUPPORT =====
        let lastTouchDist = 0;
        mapContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                lastTranslateX = translateX;
                lastTranslateY = translateY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                lastTouchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        mapContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                translateX = lastTranslateX + (e.touches[0].clientX - startX);
                translateY = lastTranslateY + (e.touches[0].clientY - startY);
                updateTransform();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const prevScale = scale;
                scale = Math.min(Math.max(scale * (dist / lastTouchDist), 0.5), 4);
                lastTouchDist = dist;

                const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                translateX = centerX - (centerX - translateX) * (scale / prevScale);
                translateY = centerY - (centerY - translateY) * (scale / prevScale);
                updateTransform();
            }
        }, { passive: false });

        mapContainer.addEventListener('touchend', () => {
            isDragging = false;

        // Transforma menções de locais em links clicáveis
        function linkifyLocations(text) {
            // Ordenar por comprimento (maior primeiro) para evitar matches parciais
            const names = Object.keys(locationNameToSvgId).sort((a, b) => b.length - a.length);
            let result = text;
            names.forEach(name => {
                const svgId = locationNameToSvgId[name];
                const regex = new RegExp(`(?<!<[^>]*)\\b(${name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})\\b`, 'g');
                result = result.replace(regex, `<a class="map-link" href="#" onclick="highlightLocation('${svgId}'); return false;">$1</a>`);
            });
            return result;
        }

        // Calcular offsets para paradas no mesmo local
        function getOffsetStops() {
            const counts = {};
            return journeyStops.map((stop, i) => {
                const key = `${Math.round(stop.x / 50)}_${Math.round(stop.y / 50)}`;
                counts[key] = (counts[key] || 0);
                const visit = counts[key];
                counts[key]++;
                // Offset espiral para visitas repetidas
                const angle = visit * 1.2;
                const dist = visit * 18;
                return {
                    ...stop,
                    ox: stop.x + Math.cos(angle) * dist,
                    oy: stop.y + Math.sin(angle) * dist
                };
            });
        }

        function advanceJourney() {
            if (!svgDoc || !trailGroup) return;
            if (currentStopIndex >= offsetStops.length) {
                // Jornada completa
                stopJourney();
                return;
            }

            const thisIndex = currentStopIndex;
            const stop = offsetStops[thisIndex];
            const linesGroup = svgDoc.getElementById('journey-lines');
            const stopsGroup = svgDoc.getElementById('journey-stops-group');
            const partyGroup = svgDoc.getElementById('journey-party');

            // Desenhar linha do stop anterior para o atual
            if (thisIndex > 0) {
                const prev = offsetStops[thisIndex - 1];
                const line = svgDoc.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', prev.ox);
                line.setAttribute('y1', prev.oy);
                line.setAttribute('x2', stop.ox);
                line.setAttribute('y2', stop.oy);
                line.setAttribute('stroke', '#111');
                line.setAttribute('stroke-width', '3.5');
                line.setAttribute('stroke-dasharray', '12 7');
                line.setAttribute('stroke-linecap', 'round');
                line.style.opacity = '0';
                line.style.transition = 'opacity 0.5s ease';
                linesGroup.appendChild(line);

                // Animar personagens se movendo
                const chars = [
                    svgDoc.getElementById('party-char-0'),
                    svgDoc.getElementById('party-char-1'),
                    svgDoc.getElementById('party-char-2'),
                    svgDoc.getElementById('party-char-3')
                ];

                const duration = 2500; // ms de viagem entre paradas
                const startTime = performance.now();

                function animateParty(now) {
                    // Se a jornada foi cancelada, parar
                    if (!trailGroup) return;

                    const elapsed = now - startTime;
                    const t = Math.min(elapsed / duration, 1);
                    // Ease in-out
                    const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

                    const cx = prev.ox + (stop.ox - prev.ox) * eased;
                    const cy = prev.oy + (stop.oy - prev.oy) * eased;

                    if (chars[0]) chars[0].setAttribute('transform', `translate(${cx - 36}, ${cy - 45})`);
                    if (chars[1]) chars[1].setAttribute('transform', `translate(${cx + 36}, ${cy - 45})`);
                    // Flint (centro) e Azarran (centro) — só movem se visíveis
                    if (chars[2] && chars[2].style.opacity !== '0') chars[2].setAttribute('transform', `translate(${cx}, ${cy - 45})`);
                    if (chars[3] && chars[3].style.opacity !== '0') chars[3].setAttribute('transform', `translate(${cx}, ${cy - 45})`);

                    // Mostrar linha progressivamente
                    line.style.opacity = String(eased);

                    if (t < 1) {
                        requestAnimationFrame(animateParty);
                    } else {
                        // Chegou na parada
                        placeStop(stop, thisIndex, stopsGroup);
                        showJourneyStop(journeyStops[thisIndex], thisIndex);

                        // Flint sai do grupo no stop 5 (Veyrinn primeira vez)
                        if (thisIndex >= 5 && chars[2]) {
                            chars[2].style.opacity = '0';
                            chars[2].style.transition = 'opacity 1s ease';
                        }

                        // Azarran entra no grupo no stop 9 (Cerco de Myrrendale)
                        if (thisIndex >= 9 && chars[3]) {
                            chars[3].style.opacity = '1';
                            chars[3].style.transition = 'opacity 1s ease';
                            chars[3].setAttribute('transform', `translate(${cx}, ${cy - 45})`);
                        }

                        if (journeyMode === 'auto' && currentStopIndex === thisIndex) {
                            journeyAnimation = setTimeout(() => {
                                currentStopIndex++;
                                advanceJourney();
                            }, 3000);
                        }
                    }
                }

                requestAnimationFrame(animateParty);
            } else {
                // Primeiro stop — posicionar direto
                placeStop(stop, 0, stopsGroup);
                showJourneyStop(journeyStops[0], 0);

                if (journeyMode === 'auto') {
                    journeyAnimation = setTimeout(() => {
                        currentStopIndex++;
                        advanceJourney();
                    }, 2000);
                }
            }
        }

        function placeStop(stop, index, stopsGroup) {
            const stopG = svgDoc.createElementNS('http://www.w3.org/2000/svg', 'g');
            stopG.style.cursor = 'pointer';

            const circle = svgDoc.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', stop.ox);
            circle.setAttribute('cy', stop.oy);
            circle.setAttribute('r', '12');
            circle.setAttribute('fill', '#111');
            circle.setAttribute('stroke', 'rgba(212, 168, 67, 0.95)');
            circle.setAttribute('stroke-width', '2.5');

            const numText = svgDoc.createElementNS('http://www.w3.org/2000/svg', 'text');
            numText.setAttribute('x', stop.ox);
            numText.setAttribute('y', stop.oy + 5);
            numText.setAttribute('text-anchor', 'middle');
            numText.setAttribute('font-family', 'serif');
            numText.setAttribute('font-size', '12');
            numText.setAttribute('font-weight', 'bold');
            numText.setAttribute('fill', '#d4a843');
            numText.textContent = index + 1;

            stopG.appendChild(circle);
            stopG.appendChild(numText);

            stopG.addEventListener('click', (e) => {
                e.stopPropagation();
                showJourneyStop(journeyStops[index], index);
            });

            stopG.addEventListener('mouseenter', () => {
                circle.setAttribute('r', '14');
            });
            stopG.addEventListener('mouseleave', () => {
                circle.setAttribute('r', '12');
            });

            // Fade in
            stopG.style.opacity = '0';
            stopG.style.transition = 'opacity 0.4s ease';
            stopsGroup.appendChild(stopG);
            requestAnimationFrame(() => { stopG.style.opacity = '1'; });
        }

        function removeTrail() {
            if (journeyAnimation) {
                clearTimeout(journeyAnimation);
                journeyAnimation = null;
            }
            if (trailGroup && trailGroup.parentNode) {
                trailGroup.parentNode.removeChild(trailGroup);
                trailGroup = null;
            }
            // Limpar clip-paths
            if (svgDoc) {
                const defs = svgDoc.querySelector('defs');
                if (defs) {
                    const clips = defs.querySelectorAll('[id^="party-clip-"]');
                    clips.forEach(c => c.remove());
                }
            }
        }
    </script>
</body>
</html>
